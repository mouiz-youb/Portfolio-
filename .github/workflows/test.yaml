name: React CI-CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm install
      - name: Run linting
        run: npm run lint
      - name: Build project
        run: npm run build
      - name: Upload build (optional)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist