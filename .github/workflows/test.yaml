name : React CI-CD Pipeline
# This tells github when to run the script 
on:
  push:
    branches: [ main , dev ]
  pull_request:
    branches: [ main ]
# This is the set of steps to run
jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v2
        - name: Use Node.js
          uses: actions/setup-node@v2
          with:
            node-version: '24.x'
        - name: Install dependencies
          run: npm install
        - name: Run tests
          run: npm test -- --coverage
        - name: Build project
          run: npm run build
          
